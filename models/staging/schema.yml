version: 2

models:
  - name: stg_appointments
    description: >
      Appointments typed and cleaned, 1:1 with the raw export minus exact
      duplicate rows. scheduled_at parsed from four source formats.
    columns:
      - name: appointment_id
        tests: [unique, not_null]
      - name: client_id
        description: >
          Some Completed appointments reference client ids absent from the
          clients export; kept on purpose (revenue is real), hence warn.
          Counts in DECISIONS.md.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
              config:
                severity: warn
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_patients')
                field: patient_id
      - name: status
        description: Nulls are preserved in staging; count and handling in DECISIONS.md.
        tests:
          - accepted_values:
              arguments:
                values: ['Completed', 'Scheduled', 'Cancelled', 'NoShow']
      - name: scheduled_at
        tests: [not_null]

  - name: stg_clients
    description: >
      Clients 1:1 with raw. email/phone are dynamically masked; email_hash and
      phone_hash (sha256 of normalized values) are the join/dedup keys.
    columns:
      - name: client_id
        tests: [unique, not_null]
      - name: email
        description: Dynamically masked email; the raw value never leaves the seed.
        config:
          meta: {contains_pii: true}
          tags: [pii]
      - name: phone
        description: Dynamically masked phone.
        config:
          meta: {contains_pii: true}
          tags: [pii]
      - name: email_hash
        description: sha256 of normalized email; dedup/join key (pseudonymized PII).
        config:
          meta: {contains_pii: true}
          tags: [pii]
        tests: [not_null]
      - name: phone_hash
        description: sha256 of normalized phone; identity cross-check key (pseudonymized PII).
        config:
          meta: {contains_pii: true}
          tags: [pii]

  - name: stg_patients
    description: >
      Patients 1:1 with raw, typed. Weight outliers kept and flagged by a warn
      test; nulls preserved.
    columns:
      - name: patient_id
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id

  - name: stg_gladly_calls
    description: One row per PHONE_CALL contact from the Gladly export.
    columns:
      - name: contact_id
        tests: [unique, not_null]
      - name: customer_phone
        description: Dynamically masked pet-parent phone.
        config:
          meta: {contains_pii: true}
          tags: [pii]
      - name: customer_phone_hash
        description: sha256 of normalized phone (pseudonymized PII).
        config:
          meta: {contains_pii: true}
          tags: [pii]
      - name: conversation_id
        tests: [not_null]
      - name: started_at
        tests: [not_null]
